<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactivity Examples</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="div1">
        <p>Good morning, {{ fullName }}.</p>
        <p>You have {{ unreadEmails }} unread emails and {{ totalEmails }} emails in total.</p>

        <button v-bind:disabled="!canReadEmail" @click="readEmail">Read an email</button>
        <button v-bind:disabled="false" @click="getNewEmail">Get more email</button>
    </div>

    <script type="module">
        const { createApp } = Vue;

        const myApp1 = createApp({
            data() {
                return {
                    firstName: "Mark",
                    lastName: "Jones",
                    unreadEmails: 5,
                    readEmails: 100
                };
            },
            computed: {
                fullName() {
                    return this.firstName + " " + this.lastName;
                },
                totalEmails() {
                    return this.readEmails + this.unreadEmails;
                },
                canReadEmail() {
                    return this.unreadEmails > 0;
                }
            },
            methods: {
                readEmail() {
                    this.unreadEmails = this.unreadEmails - 1;
                },
                getNewEmail() {
                    this.unreadEmails = this.unreadEmails + 5;
                }
            }
        });

        myApp1.mount("#div1");
    </script>
</body>
</html>
