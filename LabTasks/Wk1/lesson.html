<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After-School Lesson</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
        <h2>{{ subject }}</h2>
        <p>Location: {{ location }}</p>
        <p>Price: £{{ price }}</p>
        <img v-bind:src="image" v-bind:alt="altText" width="300">
    </div>

    <script type="module">
        const { createApp } = Vue;

        const app = createApp({
            data() {
                return {
                    subject: "Computer Science",
                    location: "Hendon",
                    price: 50,
                    image: "../images/koalaSmall.jpg",
                    altText: "Computer Science after-school lesson image"
                }
            }
        });

        app.mount("#app");
    </script>
</body>
</html>
